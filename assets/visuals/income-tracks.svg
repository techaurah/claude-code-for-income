<text x="40" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#475569" text-anchor="start">Most durable practices stack two: delivery income funds the product, the audit feeds the retainer.</text>
<text x="40" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#475569" text-anchor="start">Demand context with sources and limits: Lesson 01. Nothing in this diagram is an earnings figure.</text>
